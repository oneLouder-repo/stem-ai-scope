<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roundups · STEM AI Scope</title>
<meta name="description" content="Weekly roundups and a searchable database of every scanned item.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23c2410c' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%236d28d9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="roundups">
<main>

<div class="wrap">
  <div class="kicker" style="margin-top:32px">Archive</div>
  <h1>Weekly roundups</h1>
  <p class="lede">Each week's scan as a digest. Switch to the database view to search, sort and export every item.</p>
  <div class="toolbar">
    <div class="tabs" role="tablist"><button data-v="weeks" role="tab">Roundups</button><button data-v="table" role="tab">Database</button></div>
    <input type="search" id="q" placeholder="Search titles, summaries, publishers…" aria-label="Search">
    <select id="fGroup" aria-label="Theme"></select><select id="fRegion" aria-label="Region"></select>
    <select id="fKind" aria-label="Type"></select><select id="fWeek" aria-label="Week"></select>
    <button class="btn" id="csv">⇩ CSV</button>
  </div>
  <p class="faint" id="count"></p>
  <div id="weeks"></div>
  <div id="tableView" hidden><div class="table-wrap"><table>
    <thead><tr><th data-k="date">Date</th><th data-k="title">Item</th><th data-k="publisher">Publisher</th><th data-k="region">Region</th><th data-k="kind">Type</th><th>Topics</th><th data-k="week">Week</th></tr></thead>
    <tbody id="tbody"></tbody></table></div></div>
</div>

</main>
<script src="assets/app.js"></script>
</body>
</html>
